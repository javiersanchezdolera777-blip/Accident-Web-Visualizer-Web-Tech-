<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVis - US Traffic Accidents Visualizer</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <header>
        <h1>🚗 AVis Dashboard</h1>
        <a href="views/admin.html" class="admin-btn">Admin Login</a>
    </header>

    <div class="dashboard-container">

        <aside class="sidebar">
            <h2>Filters</h2>

            <div style="margin-bottom: 15px;">
                <label for="filter-state"><strong>State:</strong></label><br>
                <select id="filter-state" style="width: 100%; padding: 5px;">
                    <option value="">All states</option>
                    <option value="CA">California (CA)</option>
                    <option value="TX">Texas (TX)</option>
                    <option value="FL">Florida (FL)</option>
                    <option value="NY">New York (NY)</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="filter-severity"><strong>Severity:</strong></label><br>
                <select id="filter-severity" style="width: 100%; padding: 5px;">
                    <option value="">Any level</option>
                    <option value="1">Level 1 (Mild)</option>
                    <option value="2">Level 2 (Moderate)</option>
                    <option value="3">Level 3 (Severe)</option>
                    <option value="4">Level 4 (Very Severe)</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="filter-weather"><strong>Weather:</strong></label><br>
                <select id="filter-weather" style="width: 100%; padding: 5px;">
                    <option value="">Any weather</option>
                    <option value="Clear">Clear</option>
                    <option value="Overcast">Overcast</option>
                    <option value="Light Rain">Light Rain</option>
                    <option value="Mostly Cloudy">Mostly Cloudy</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="filter-date-from"><strong>From:</strong></label><br>
                <input type="date" id="filter-date-from" style="width: 100%; padding: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="filter-date-to"><strong>To:</strong></label><br>
                <input type="date" id="filter-date-to" style="width: 100%; padding: 5px;">
            </div>
            <button id="btn-apply-filters"
                style="width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Apply Filters
            </button>

            <hr style="margin: 20px 0;">

            <h3>Export Data</h3>
            <div style="display: flex; gap: 10px; flex-direction: column;">
                <button id="btn-export-csv" style="padding: 10px; cursor: pointer;">Download CSV</button>
                <button id="btn-export-webp" style="padding: 10px; cursor: pointer;">WebP Chart by State</button>
                <button id="btn-export-svg" style="padding: 10px; cursor: pointer;">SVG Chart by Severity</button>
                <button id="btn-export-line" style="padding: 10px; cursor: pointer;">PDF Line Chart</button>

            </div>
        </aside>

        <main class="content">
            <div id="map" style="height: 400px; background-color: #eee;"></div>

            <div class="charts-container">
                <div class="chart-wrapper">
                    <canvas id="barChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="chart-wrapper">
                      <canvas id="lineChart"></canvas>
                </div>  
            </div>
        </main>
    </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <script src="assets/js/main.js"></script>
</body>

</html>
